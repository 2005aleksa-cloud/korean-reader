<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean Reader</title>
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f5f5f0;
  color: #263b32;
  font-family: Arial, sans-serif;
}
header {
  background: #263b32;
  color: white;
  padding: 24px 18px;
  font-size: 23px;
  font-weight: bold;
}
main { padding: 18px; max-width: 650px; margin: auto; }
.panel {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}
textarea {
  width: 100%;
  min-height: 145px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 17px;
}
button {
  background: #365b49;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  margin: 5px 3px 5px 0;
}
button.secondary { background: #e6ece7; color: #263b32; }
#reader { font-size: 23px; line-height: 2.5; }
.word {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: bottom;
  margin: 0 3px;
  cursor: pointer;
}
.translation {
  font-size: 11px;
  color: #789080;
  line-height: 1.3;
}
.hidden .translation { visibility: hidden; }
#card {
  display: none;
  background: #edf3ee;
  border-radius: 14px;
  padding: 16px;
  margin-top: 15px;
}
input[type=file] { max-width: 100%; }
</style>
</head>
<body>
<header>📖 Korean Reader</header>
<main>
  <div class="panel">
    <h3>Мой корейский текст</h3>
    <textarea id="source" placeholder="Вставь сюда корейский текст..."></textarea>
    <p>Или загрузи документ:</p>
    <input type="file" id="file" accept=".txt,.docx">
    <br><br>
    <button onclick="startReading()">Начать чтение</button>
  </div>

  <div class="panel">
    <h3>Чтение</h3>
    <button class="secondary" onclick="toggleTranslations()">
      Скрыть / показать переводы
    </button>
    <div id="reader">Твой текст появится здесь.</div>
    <div id="card">
      <h2 id="selectedWord"></h2>
      <p id="selectedTranslation">Перевод пока не загружен.</p>
      <input id="manualTranslation" placeholder="Добавить перевод вручную">
      <button onclick="saveTranslation()">Сохранить перевод</button>
      <button class="secondary" onclick="closeCard()">Закрыть</button>
    </div>
  </div>

  <div class="panel">
    <h3>⭐ Мой словарик</h3>
    <div id="dictionary">Пока слов нет.</div>
  </div>
</main>

<script>
let translations = JSON.parse(
  localStorage.getItem("kr-translations") || "{}"
);
let hidden = false;
let selected = "";

const source = document.getElementById("source");
const reader = document.getElementById("reader");

document.getElementById("file").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.name.endsWith(".txt")) {
    source.value = await file.text();
  } else if (file.name.endsWith(".docx")) {
    const result = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
    source.value = result.value;
  } else {
    alert("Поддерживаются TXT и DOCX.");
  }
});

function startReading() {
  const text = source.value.trim();
  if (!text) return alert("Сначала добавь корейский текст.");

  reader.innerHTML = "";
  const parts = text.match(/[\p{L}\p{M}\p{N}]+|[^\p{L}\p{M}\p{N}]+/gu) || [];

  parts.forEach(part => {
    if (/^[\p{L}\p{M}\p{N}]+$/u.test(part)) {
      const span = document.createElement("span");
      span.className = "word";

      const hint = document.createElement("span");
      hint.className = "translation";
      hint.textContent = translations[part] || "···";

      const word = document.createElement("span");
      word.textContent = part;

      span.append(hint, word);
      span.addEventListener("click", () => openCard(part));
      reader.append(span);
    } else {
      reader.append(document.createTextNode(part));
    }
  });

  reader.classList.toggle("hidden", hidden);
}

function toggleTranslations() {
  hidden = !hidden;
  reader.classList.toggle("hidden", hidden);
}

function openCard(word) {
  selected = word;
  document.getElementById("selectedWord").textContent = word;
  document.getElementById("selectedTranslation").textContent =
    translations[word] || "Перевод пока не добавлен.";
  document.getElementById("manualTranslation").value =
    translations[word] || "";
  document.getElementById("card").style.display = "block";
}

function closeCard() {
  document.getElementById("card").style.display = "none";
}

function saveTranslation() {
  const value = document.getElementById("manualTranslation").value.trim();
  if (!value || !selected) return;

  translations[selected] = value;
  localStorage.setItem("kr-translations", JSON.stringify(translations));
  document.getElementById("selectedTranslation").textContent = value;
  startReading();
  showDictionary();
}

function showDictionary() {
  const box = document.getElementById("dictionary");
  box.innerHTML = "";

  Object.entries(translations).forEach(([word, meaning]) => {
    const p = document.createElement("p");
    p.textContent = word + " — " + meaning;
    box.append(p);
  });

  if (!Object.keys(translations).length) {
    box.textContent = "Пока слов нет.";
  }
}

showDictionary();
</script>
</body>
</html>
